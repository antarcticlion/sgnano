# smf2vgm の既定の引数（S:/SystemSettings/smf2vgm.cfg）。コマンドの引数が後から重なる。
# 【2026-11-16】フルサイズ: サウンドフォントの標本を切らず、全部のレイヤーを入れる（C352 の ROM は 16MB = 256 バンクまで）。
# 曲が 16MB を超えるときだけ、損の小さい標本から間引く（--rom-budget。バンクに詰める隙間のぶん 15MB）。
# 大きな VGZ は実時間の再生（PSRAM に丸ごと持つ）には入らないことがあるが、WAV / MP3 への書き出しはページで引いて作れる。
--chip c352
--max-banks 256 --rom-budget 15728640
--env-ms 10 --env-max-ms 100 --volume-step 2
# 実機で鳴らせる小さな VGZ にするなら（以前の既定。1 レイヤー・標本 16KB まで・ROM 64 バンクまで）:
# --layers 1 --max-banks 64 --max-sample 16384
# サウンドフォントを決めるなら（省くと各ドライブの SoundFonts フォルダから探す。MuseScore_General_Full.sf2 が先）:
# --sf2 A:/SoundFonts/MuseScore_General_Full.sf2
